# App de bureau : à chaque tag vX.Y.Z, construit l'installateur Windows (et l'AppImage Linux)
# et les joint à une release GitHub. Aucun secret à configurer (jeton fourni par GitHub).
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      # Les scripts d'extraction trouvent-ils leurs modules dans l'app empaquetée ?
      - name: Check the packaged app
        shell: bash
        run: |
          if [ -d release/win-unpacked ]; then cd release/win-unpacked/resources/app && ELECTRON_RUN_AS_NODE=1 "../../Celeste CS2.exe" scripts/check-package.mjs; else cd release/linux-unpacked/resources/app && ELECTRON_RUN_AS_NODE=1 ../../celeste-cs2 scripts/check-package.mjs; fi
      - uses: actions/upload-artifact@v4
        with:
          name: celeste-cs2-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            release/*.exe
            release/*.AppImage
